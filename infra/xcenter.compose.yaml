services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      BUILD_COMMIT: ${BUILD_COMMIT:?Set the deployed Git commit}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      CORS_ORIGINS: https://echo.xcenter.it
    ports: ["127.0.0.1:18841:4280"]
    volumes: ["echo-data:/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4280/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
  web:
    image: nginxinc/nginx-unprivileged:stable-alpine
    volumes:
      - ../web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:18840:8080"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  echo-data:
