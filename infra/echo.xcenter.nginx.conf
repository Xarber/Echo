server {
 listen 80;
 server_name echo.xcenter.it;
 return 301 https://echo.xcenter.it$request_uri;
}
server {
 listen 443 ssl;
 server_name echo.xcenter.it;
 include /etc/nginx/snippets/xcenter-deny-hidden.conf;
 ssl_certificate /etc/letsencrypt/live/xcenter.it-0002/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/xcenter.it-0002/privkey.pem;
 access_log off;
 location /api/ {
  proxy_pass http://127.0.0.1:18841/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 75s;
 }

 location / {
  proxy_pass http://127.0.0.1:18840;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
 }
}
